<!-- CHAT WINDOW -->
<section class="chat">
  @for (msg of messages; track $index) {
    <div class="message" [class.user]="msg.sender === 'You'">
      @if (msg.sender !== 'You') {
        <div class="avatar">PG</div>
      }
      <div class="bubble">
        {{ msg.text }}
      </div>
    </div>
  }
</section>

<!-- INPUT BOX -->
<footer class="input-area">
  <div class="input-box">
    <input [(ngModel)]="userInput" placeholder="Type your message..." (keyup.enter)="sendMessage()" />
    <button (click)="sendMessage()">➤</button>
  </div>
</footer>
